<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartList - Hierarchical Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .tree-line {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 8px;
            font-weight: bold;
            color: #64748b;
        }
        
        .item-container {
            transition: all 0.2s ease-in-out;
        }
        
        .item-container:hover {
            transform: translateX(4px);
        }
        
        .edit-input {
            transition: box-shadow 0.2s;
        }
        
        .edit-input:focus {
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .completed-text {
            text-decoration: line-through;
            opacity: 0.5;
        }
        
        .action-btn {
            opacity: 0.6;
            transition: all 0.2s;
        }
        
        .action-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }
        
        .nested-item {
            padding-left: 24px;
            border-left: 2px solid #e2e8f0;
        }
        
        .add-form {
            animation: slideDown 0.2s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="bg-white/10 backdrop-blur-md border-b border-white/20">
            <div class="max-w-6xl mx-auto px-6 py-8">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-4xl font-bold text-white mb-2">📝 SmartList</h1>
                        <p class="text-white/80">Hierarchical task management with Dynalist-style editing</p>
                    </div>
                    <button id="addNewBtn" class="bg-white text-purple-600 px-6 py-3 rounded-lg font-semibold hover:bg-white/90 transition shadow-lg">
                        ➕ Add New Item
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-6xl mx-auto px-6 py-8">
            <!-- Add Form (Hidden by default) -->
            <div id="addFormContainer" class="hidden add-form mb-8">
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">Add New Item</h2>
                    <div class="space-y-4">
                        <input 
                            type="text" 
                            id="newItemTitle" 
                            placeholder="Enter item title..." 
                            class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none edit-input"
                        >
                        <div class="flex gap-3">
                            <button id="addItemBtn" class="flex-1 bg-green-500 text-white py-2 rounded-lg font-semibold hover:bg-green-600 transition">
                                ✅ Add Item
                            </button>
                            <button id="cancelAddBtn" class="flex-1 bg-red-500 text-white py-2 rounded-lg font-semibold hover:bg-red-600 transition">
                                ❌ Cancel
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Items List -->
            <div class="bg-white rounded-xl shadow-lg p-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Your List</h2>
                <div id="itemsList" class="space-y-3">
                    <!-- Items will be rendered here by JavaScript -->
                    <div class="text-center py-12">
                        <p class="text-gray-500 text-lg">No items yet. Click "➕ Add New Item" to get started!</p>
                    </div>
                </div>
            </div>

            <!-- Quick Guide -->
            <div class="mt-8 bg-white/10 backdrop-blur-md rounded-xl p-6 border border-white/20">
                <h3 class="text-white font-bold text-lg mb-4">⌨️ Quick Guide</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-white/90 text-sm">
                    <div>✏️ <strong>Click item</strong> to edit inline</div>
                    <div>➕ <strong>Button</strong> to add sub-items</div>
                    <div>✓ <strong>Checkbox</strong> to mark complete</div>
                    <div>🗑️ <strong>Button</strong> to delete</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script>
        // SmartList App - Main Application Logic
        
        class SmartList {
            constructor() {
                this.items = [];
                this.editingId = null;
                this.addingNestedId = null;
                this.init();
            }

            async init() {
                // Initialize the app
                this.attachEventListeners();
                this.loadItems();
            }

            attachEventListeners() {
                // Top-level add button
                document.getElementById('addNewBtn').addEventListener('click', () => this.toggleAddForm());
                document.getElementById('cancelAddBtn').addEventListener('click', () => this.toggleAddForm());
                document.getElementById('addItemBtn').addEventListener('click', () => this.addItem());
                
                // Enter key to add item
                document.getElementById('newItemTitle').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addItem();
                });
            }

            toggleAddForm() {
                const formContainer = document.getElementById('addFormContainer');
                formContainer.classList.toggle('hidden');
                if (!formContainer.classList.contains('hidden')) {
                    document.getElementById('newItemTitle').focus();
                }
            }

            async addItem() {
                const title = document.getElementById('newItemTitle').value.trim();
                if (!title) {
                    alert('Please enter a title');
                    return;
                }

                // Add to local items array (in real app, this would call backend API)
                const newItem = {
                    id: Date.now(),
                    title: title,
                    parent_id: null,
                    completed: false,
                    created_at: new Date().toISOString()
                };

                this.items.push(newItem);
                document.getElementById('newItemTitle').value = '';
                this.toggleAddForm();
                this.render();
            }

            async addSubItem(parentId, title) {
                if (!title.trim()) return;

                const newItem = {
                    id: Date.now(),
                    title: title.trim(),
                    parent_id: parentId,
                    completed: false,
                    created_at: new Date().toISOString()
                };

                this.items.push(newItem);
                this.addingNestedId = null;
                this.render();
            }

            startEdit(id) {
                this.editingId = id;
                this.render();
                setTimeout(() => {
                    const input = document.getElementById(`edit-input-${id}`);
                    if (input) input.focus();
                }, 0);
            }

            saveEdit(id) {
                const input = document.getElementById(`edit-input-${id}`);
                if (!input) return;

                const newTitle = input.value.trim();
                if (!newTitle) {
                    alert('Title cannot be empty');
                    return;
                }

                const item = this.items.find(i => i.id === id);
                if (item) {
                    item.title = newTitle;
                    item.updated_at = new Date().toISOString();
                }

                this.editingId = null;
                this.render();
            }

            toggleComplete(id) {
                const item = this.items.find(i => i.id === id);
                if (item) {
                    item.completed = !item.completed;
                    this.render();
                }
            }

            deleteItem(id) {
                if (!confirm('Are you sure you want to delete this item and all its sub-items?')) return;

                // Remove item and all children
                const toRemove = [id];
                let i = 0;
                while (i < toRemove.length) {
                    const parentId = toRemove[i];
                    this.items.forEach(item => {
                        if (item.parent_id === parentId && !toRemove.includes(item.id)) {
                            toRemove.push(item.id);
                        }
                    });
                    i++;
                }

                this.items = this.items.filter(item => !toRemove.includes(item.id));
                this.render();
            }

            startAddNested(id) {
                this.addingNestedId = id;
                this.render();
                setTimeout(() => {
                    const input = document.getElementById(`nested-input-${id}`);
                    if (input) input.focus();
                }, 0);
            }

            cancelAddNested() {
                this.addingNestedId = null;
                this.render();
            }

            loadItems() {
                // In a real app, this would load from the backend/API
                // For now, we'll load from localStorage
                const saved = localStorage.getItem('smartlist_items');
                if (saved) {
                    this.items = JSON.parse(saved);
                }
                this.render();
            }

            saveItems() {
                localStorage.setItem('smartlist_items', JSON.stringify(this.items));
            }

            getChildrenOf(parentId) {
                return this.items.filter(item => item.parent_id === parentId);
            }

            renderItem(item, level = 0) {
                const isEditing = this.editingId === item.id;
                const children = this.getChildrenOf(item.id);
                const isAddingNested = this.addingNestedId === item.id;

                // Tree prefix
                let treePrefix = '';
                if (level > 0) {
                    treePrefix = children.length > 0 ? '├─ ' : '└─ ';
                }

                const indent = '&nbsp;'.repeat(level * 4);

                return `
                    <div class="item-container ${level > 0 ? 'nested-item' : ''}">
                        <div class="flex items-center gap-3 py-3 px-4 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
                            <!-- Checkbox -->
                            <input 
                                type="checkbox" 
                                class="w-5 h-5 text-purple-600 cursor-pointer"
                                ${item.completed ? 'checked' : ''}
                                onchange="app.toggleComplete(${item.id})"
                            >

                            <!-- Item Content -->
                            <div class="flex-1">
                                ${isEditing ? `
                                    <div class="flex gap-2">
                                        <input 
                                            type="text" 
                                            id="edit-input-${item.id}"
                                            value="${item.title}"
                                            class="flex-1 px-3 py-1 border-2 border-purple-400 rounded edit-input"
                                            onkeypress="if(event.key==='Enter') app.saveEdit(${item.id})"
                                        >
                                        <button onclick="app.saveEdit(${item.id})" class="bg-green-500 text-white px-3 py-1 rounded action-btn">
                                            💾
                                        </button>
                                    </div>
                                ` : `
                                    <div class="flex items-center gap-2 cursor-pointer hover:text-purple-600" onclick="app.startEdit(${item.id})">
                                        <span class="tree-line">${treePrefix}</span>
                                        <span class="${item.completed ? 'completed-text' : ''} text-gray-800">
                                            ${item.title}
                                        </span>
                                    </div>
                                `}
                            </div>

                            <!-- Action Buttons -->
                            <div class="flex gap-2">
                                <button onclick="app.startAddNested(${item.id})" class="action-btn text-xl" title="Add sub-item">
                                    ➕
                                </button>
                                <button onclick="app.deleteItem(${item.id})" class="action-btn text-xl" title="Delete item">
                                    🗑️
                                </button>
                            </div>
                        </div>

                        <!-- Add Nested Form -->
                        ${isAddingNested ? `
                            <div class="add-form ml-6 mt-3">
                                <div class="flex gap-2">
                                    <input 
                                        type="text" 
                                        id="nested-input-${item.id}"
                                        placeholder="Type sub-item title..."
                                        class="flex-1 px-3 py-2 border-2 border-purple-400 rounded edit-input"
                                        onkeypress="if(event.key==='Enter') app.addSubItem(${item.id}, this.value); this.value=''"
                                    >
                                    <button onclick="app.addSubItem(${item.id}, document.getElementById('nested-input-${item.id}').value); document.getElementById('nested-input-${item.id}').value=''" class="bg-green-500 text-white px-3 py-1 rounded">
                                        ✓
                                    </button>
                                    <button onclick="app.cancelAddNested()" class="bg-red-500 text-white px-3 py-1 rounded">
                                        ✕
                                    </button>
                                </div>
                            </div>
                        ` : ''}

                        <!-- Render Children -->
                        <div class="mt-2">
                            ${children.map(child => this.renderItem(child, level + 1)).join('')}
                        </div>
                    </div>
                `;
            }

            render() {
                const rootItems = this.items.filter(item => item.parent_id === null);
                const itemsList = document.getElementById('itemsList');

                if (rootItems.length === 0) {
                    itemsList.innerHTML = `
                        <div class="text-center py-12">
                            <p class="text-gray-500 text-lg">No items yet. Click "➕ Add New Item" to get started!</p>
                        </div>
                    `;
                } else {
                    itemsList.innerHTML = rootItems.map(item => this.renderItem(item)).join('');
                }

                this.saveItems();
            }
        }

        // Initialize the app
        const app = new SmartList();
    </script>
</body>
</html>
